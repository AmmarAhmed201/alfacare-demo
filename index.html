<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="نموذج تجريبي لنظام إدارة مركز Alfa Care للعلاج الطبيعي (بيانات وهمية)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23478c1f%22/%3E%3Ctext x=%2232%22 y=%2245%22 font-size=%2238%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22serif%22%3E%CE%B1%3C/text%3E%3C/svg%3E">
</head>
<body>
<title>نظام Alfa Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: the center's calendar is the home screen — every therapist side by side (resource columns), day / week / month; details and booking open in a side drawer (a full page on phones), never a pop-up */
:root{
  --bg:#f3f5ef; --surface:#ffffff; --surface-2:#eef2e8; --surface-3:#e4eadb; --fg:#16200f; --muted:#5a6650; --line:#dfe5d6; --line-2:#c9d2bd;
  --brand:#478c1f; --brand-ink:#ffffff; --brand-soft:#e3eed3; --lime:#bed02b;
  --ok:#2c7a32; --ok-soft:#e1f0df; --warn:#9a6200; --warn-soft:#fbedd0; --bad:#b3392a; --bad-soft:#f8e0db; --info:#2f6db5; --info-soft:#e0eaf8;
  --r1:#2a78d6; --r2:#eb6834; --r3:#1baf7a; --r4:#6250d6; --r5:#e87ba4;
  --now:#d6402b;
  --wa-head:#0b7a63; --wa-bg:#ece5dc; --wa-in:#ffffff; --wa-out:#d8f8cf;
  --shadow:0 1px 2px rgba(22,32,15,.06),0 12px 32px -14px rgba(22,32,15,.28);
  --f-display:'Alexandria','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --r:14px; --rowh:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e130c; --surface:#151b13; --surface-2:#1c2519; --surface-3:#253021; --fg:#e7eee0; --muted:#9caa91; --line:#283425; --line-2:#3a4835;
  --brand:#6fa332; --brand-ink:#0e130c; --brand-soft:#22321a;
  --ok:#7cc47f; --ok-soft:#1b311e; --warn:#e3a944; --warn-soft:#382b12; --bad:#ef8574; --bad-soft:#3c1e19; --info:#7ea9e6; --info-soft:#18283d;
  --r1:#3987e5; --r2:#d95926; --r3:#199e70; --r4:#9085e9; --r5:#d55181; --now:#ff6b55;
  --wa-head:#1f2c33; --wa-bg:#0b141a; --wa-in:#202c33; --wa-out:#005c4b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.75); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e130c; --surface:#151b13; --surface-2:#1c2519; --surface-3:#253021; --fg:#e7eee0; --muted:#9caa91; --line:#283425; --line-2:#3a4835;
  --brand:#6fa332; --brand-ink:#0e130c; --brand-soft:#22321a;
  --ok:#7cc47f; --ok-soft:#1b311e; --warn:#e3a944; --warn-soft:#382b12; --bad:#ef8574; --bad-soft:#3c1e19; --info:#7ea9e6; --info-soft:#18283d;
  --r1:#3987e5; --r2:#d95926; --r3:#199e70; --r4:#9085e9; --r5:#d55181; --now:#ff6b55;
  --wa-head:#1f2c33; --wa-bg:#0b141a; --wa-in:#202c33; --wa-out:#005c4b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.75); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num,.ltr{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:21px;font-weight:700}
h2{font-size:16.5px;font-weight:700}
h3{font-size:14.5px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{width:38px;height:38px;border-radius:9px;background:#0d0f0b;display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.logo b{font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:1;color:#bed02b;font-weight:400;margin-top:-3px}
.logo::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:linear-gradient(90deg,#478c1f,#bed02b)}
.brand{min-width:0;flex:1}
.brand .n{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.2;white-space:nowrap}
.brand .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 8px;font-size:13px;max-width:150px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none;padding:0}
.iconbtn svg{width:20px;height:20px}
.demo-tag{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 6px;white-space:nowrap}
@media (max-width:420px){.top .demo-tag{display:none}}

/* guide strip (replaces the welcome pop-up) */
.guide{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.guide-in{max-width:1360px;margin-inline:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.guide .stepno{font-family:var(--f-display);font-weight:700;color:var(--brand);font-size:13px;white-space:nowrap}
.guide .txt{flex:1;min-width:220px;font-size:14px}
.guide .txt b{font-weight:700}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.dots i.on{background:var(--brand);width:18px;border-radius:5px}

/* shell + nav */
.tabs{position:fixed;inset:auto 0 0 0;z-index:35;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;font-size:11.5px;font-weight:600;color:var(--muted);background:none;border:0;position:relative}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;inset-inline:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.tab .dot{position:absolute;top:5px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;line-height:17px;font-weight:700}
.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;max-width:1360px;margin-inline:auto;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:220px minmax(0,1fr)}
  .tabs{position:sticky;top:57px;height:calc(100vh - 57px);flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-inline-end:1px solid var(--line);padding:16px 12px}
  .tab{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:11px 14px;border-radius:11px}
  .tab[aria-current="page"]{background:var(--brand-soft)}
  .tab[aria-current="page"]::before{display:none}
  .tab .dot{position:static;margin-inline-start:auto}
  .main{padding-block:20px 40px;width:100%}
}
body.focus .top,body.focus .tabs,body.focus .guide{display:none}
body.focus .shell{display:block}
body.focus .main{max-width:820px;padding-block:16px 32px}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:760px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.soft{background:var(--brand-soft);border-color:transparent}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.big{padding:14px 18px;font-size:16.5px;border-radius:13px;width:100%}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.brand{background:var(--brand-soft);color:var(--brand)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip .c{opacity:.7;font-variant-numeric:tabular-nums}
.chip .sw{width:10px;height:10px;border-radius:3px;flex:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.full{display:flex}.seg.full button{flex:1}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;padding:10px 0;width:100%;min-width:0}
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.field>.lab{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.6}
.hint{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:11px 13px;background:var(--info-soft);font-size:14px}
.hint svg{width:19px;height:19px;flex:none;color:var(--info);margin-top:2px}
.hint.warn{background:var(--warn-soft)} .hint.warn svg{color:var(--warn)}
.hint.ok{background:var(--ok-soft)} .hint.ok svg{color:var(--ok)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--brand-soft);color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)} .kpi.info b{color:var(--info)}
.hero-num{font-family:var(--f-display);font-size:38px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}.r5{--rc:var(--r5)}
.sw{background:var(--rc)}

/* calendar toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.datenav{display:flex;align-items:center;gap:4px}
.datenav .title{border:0;background:none;font-family:var(--f-display);font-weight:700;font-size:19px;padding:4px 8px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.datenav .title svg{width:16px;height:16px;color:var(--muted)}
.toolbar .spacer{flex:1}
.daystats{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.daystats b{color:var(--fg);font-variant-numeric:tabular-nums}
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:1240px){.cal-layout{grid-template-columns:minmax(0,1fr) 290px}}
.side{display:none}
@media (min-width:1240px){.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:76px}}

/* day grid */
.cal-scroll{overflow:auto;max-height:calc(100vh - 290px);max-height:calc(100dvh - 290px);min-height:440px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);position:relative;overscroll-behavior:contain}
.cal{display:grid;grid-template-columns:58px repeat(var(--cols),minmax(132px,1fr));min-width:calc(58px + var(--cols) * 132px);position:relative}
.ch{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line-2);padding:8px 10px;min-width:0;height:56px}
.ch .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.ch .ld{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ch .ld .bar{height:5px;flex:1}
.ch .ld .bar i{background:var(--rc)}
.corner{position:sticky;top:0;inset-inline-start:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line-2);height:56px}
.tc{position:sticky;inset-inline-start:0;z-index:2;background:var(--surface);font-size:11.5px;color:var(--muted);padding:2px 6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;height:var(--rowh);text-align:center;border-inline-end:1px solid var(--line)}
.tc.hr{color:var(--fg);font-weight:600}
.cell{height:var(--rowh);border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);padding:3px;display:grid;grid-template-columns:1fr 1fr;gap:3px;min-width:0}
.cell.half{border-bottom-style:dashed}
.cell.drop{background:var(--brand-soft)}
.cell.past{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--surface-2) 8px 9px)}
.blk{--rc:var(--r1);position:relative;border-radius:7px;padding:3px 6px;min-width:0;overflow:hidden;text-align:start;border:0;border-inline-start:3px solid var(--rc);
  background:color-mix(in srgb,var(--rc) 15%,var(--surface));font-size:12.5px;line-height:1.35;cursor:grab;display:flex;flex-direction:column;justify-content:center}
.blk .bn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .bm{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.blk.done{opacity:.55}
.blk.noshow{opacity:.6;background:repeating-linear-gradient(135deg,var(--bad-soft) 0 6px,var(--surface) 6px 12px)}
.blk.noshow .bn{text-decoration:line-through}
.blk.in{box-shadow:0 0 0 2px var(--rc) inset}
.blk.waiting::after{content:"";position:absolute;top:5px;inset-inline-end:5px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.blk.hl{animation:hl 1.6s ease-out}
@keyframes hl{0%,40%{box-shadow:0 0 0 3px var(--brand)}100%{box-shadow:none}}
.blk.cancelled{opacity:.45;background:var(--surface-2);text-decoration:line-through}
.cf{font-weight:700;font-size:11.5px}
.cf.yes{color:var(--ok)}.cf.none{color:var(--warn)}.cf.no{color:var(--bad)}.cf.move{color:var(--info)}.cf.sched{color:var(--muted)}
.add{border:1px dashed transparent;border-radius:7px;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0;min-width:0;opacity:0}
.cell:hover .add,.moving .add{opacity:1;border-color:var(--line-2)}
.moving .add{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
@media (hover:none){.add{opacity:.55;border-color:var(--line)}}
.nowline{position:absolute;inset-inline:58px 0;height:0;border-top:2px solid var(--now);z-index:2;pointer-events:none}
.nowline::before{content:attr(data-t);position:absolute;inset-inline-start:-56px;top:-10px;background:var(--now);color:#fff;font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:5px}
.closed-day{padding:48px 16px;text-align:center}

/* week + month grids */
.wk-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.wk{display:grid;grid-template-columns:62px repeat(6,minmax(92px,1fr));min-width:620px}
.wk .h{padding:8px;border-bottom:1px solid var(--line-2);font-size:13px;text-align:center;background:var(--surface);position:sticky;top:0}
.wk .h b{display:block;font-family:var(--f-display);font-size:15px}
.wk .h.today b{color:var(--brand)}
.wk .t{font-size:12px;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.wk button.c{border:0;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);background:none;padding:6px;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px}
.wk button.c b{font-size:15px;font-variant-numeric:tabular-nums}
.lv-free{background:var(--ok-soft)!important;color:var(--ok)} .lv-few{background:var(--warn-soft)!important;color:var(--warn)} .lv-full{background:var(--bad-soft)!important;color:var(--bad)} .lv-past{color:var(--muted);background:var(--surface-2)!important}
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mo .wd{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.mo button.d{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:7px 6px;min-height:84px;display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:start;min-width:0}
.mo button.d .dn{font-family:var(--f-display);font-weight:700;font-size:15px}
.mo button.d.out{opacity:.4}
.mo button.d.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.mo button.d.today .dn{color:var(--brand)}
.mo button.d.off{background:var(--surface-2)}

function dateStrip(sel,attr,ther){

    return `<button class="ds" data-${attr}="${k}" aria-pressed="${sel===k}">${k===TODAY?'النهارده':k===TMR?'بكرة':DSHORT[dd.getDay()]}<b>${dd.getDate()}</b><i style="background:${LVC[lv]}"></i></button>`}).join('')}</div>`;
}
function confirmBook(){

    p=newPatient({name:B.name.trim(),phone:B.phone.trim(),src:B.srcT==='direct'?{t:'direct'}:{t:B.srcT,id:B.srcId||(B.srcT==='ref'?REFS:INS)[0].id},c:CASES[1],pain:[],note:''});

    <div class="series">${ser.map((s,i)=>`<div><span class="k">${pk.done+i+1}</span><span class="grow">${dLabel(s.k)} • ${tm(s.t)}</span><span class="xs">${R[s.ther].short}</span>${s.adj?'<span class="adj">!</span>':''}</div>`).join('')}</div>`};
  drawer(`<h2>غيّر مواعيد ${esc(short(p.name))} الجاية</h2>`,'<div id="shBody" class="stack" style="gap:16px"></div>',`<button class="btn primary big" data-shiftok="1">${ic('check')} انقل الـ ${up.length} جلسات وبلّغه واتساب</button>`);
  B.redraw=draw;draw();

}

function autoNote(cur,p){
  const Rm=S.room,parts=[];const prev=p.pain.length?p.pain[p.pain.length-1]:null;

  if(cur.type==='exam'){const dx=CASES.find(c=>c.k===(Rm.dx||p.c.k));parts.push(`التشخيص: ${dx.n}.`);if(Rm.plan.size)parts.push(`الخطة: ${[...Rm.plan].join('، ')}.`)}
  else{if(Rm.done.size)parts.push(`اتعمل: ${[...Rm.done].join('، ')}.`);if(Rm.ex.size)parts.push(`تمارين البيت: ${[...Rm.ex].join('، ')}.`)}
  return parts.join(' ');

  if(cur.type==='exam'){const pl=[...Rm.plan].find(v=>v.startsWith('باقة')||v.startsWith('موجات'));const n=pl?parseInt(pl.match(/\d+/)[0]):10;p.c=CASES.find(c=>c.k===(Rm.dx||p.c.k));

function lineSvg(data){
  const W=640,H=190,l=12,r=40,t=14,b=26,lo=140,hi=220;
  const xs=i=>l+i*(W-r-l)/(data.length-1); // newest on the left in RTL reading: index 0 = oldest on the right
  const x=i=>W-r-(i)*(W-r-l)/(data.length-1);
  const y=v=>t+(hi-v)/(hi-lo)*(H-t-b);
  const pts=data.map((d,i)=>[x(i),y(d.v)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const L=pts[pts.length-1];window._lx=pts.map(p=>p[0]);window._ly=pts.map(p=>p[1]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;touch-action:pan-y" direction="ltr" id="lineSvg" role="img" aria-label="عدد المرضى في اليوم">
  ${[150,175,200].map(v=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${W-r+6}" y="${y(v)+4}" font-size="11" fill="var(--muted)">${v}</text>`).join('')}
  <path d="${path} L${L[0]} ${H-b} L${pts[0][0]} ${H-b}Z" fill="var(--brand-soft)"/><path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="${L[0]}" cy="${L[1]}" r="4.5" fill="var(--brand)" stroke="var(--surface)" stroke-width="2"/><text x="${L[0]+8}" y="${L[1]-8}" font-size="12" font-weight="700" fill="var(--fg)">${data[data.length-1].v}</text>
  <text x="${W-r}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${data[0].d.getDate()} ${MONTHS[data[0].d.getMonth()]}</text><text x="${l}" y="${H-6}" font-size="11" fill="var(--muted)">النهارده</text>
  <line id="cross" x1="0" x2="0" y1="${t}" y2="${H-b}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/><circle id="crossDot" r="4.5" fill="var(--brand)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
  <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg>`;
}
function bindLine(){

  const move=e=>{const bb=svg.getBoundingClientRect();const sx=(e.clientX-bb.left)/bb.width*640;let bi=0,bd=1e9;window._lx.forEach((v,i)=>{const dd=Math.abs(v-sx);if(dd<bd){bd=dd;bi=i}});
    const px=window._lx[bi],py=window._ly[bi],d=window._daily[bi];const c=$('#cross'),dot=$('#crossDot');
    c.setAttribute('x1',px);c.setAttribute('x2',px);c.setAttribute('visibility','visible');dot.setAttribute('cx',px);dot.setAttribute('cy',py);dot.setAttribute('visibility','visible');
    tip.hidden=false;tip.textContent=`${dLabel(key(d.d))} • ${d.v} مريض`;tip.style.left=Math.min(Math.max(px/640*bb.width,80),bb.width-80)+'px';tip.style.top=(py/190*bb.height)+'px'};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);

}

  if(d.who){S.room.who=d.who;S.room.pain=null;S.room.edited=false;return render()}
  if(d.act==='focus'){S.room.focus=!S.room.focus;return render()}
  if(d.pain!==undefined){S.room.pain=+d.pain;return render()}
  if(d.rc){const set=S.room[d.rc];set.has(d.v)?set.delete(d.v):set.add(d.v);return render()}
  if(d.dx){S.room.dx=d.dx;return render()}
  if(d.act==='finish')return finishRoom();
  // admin
  if(d.at){S.adminTab=d.at;return render()}
  if(d.per){S.period=d.per;return render()}
  if(d.case){S.openCase=S.openCase===d.case?null:d.case;return render()}
  if(d.ref)return openRef(d.ref);
  if(d.refwa){const r=REFS.find(x=>x.id===d.refwa),s=refStats(r);toast('اتبعت لـ '+r.n,[`${s.active.length} مرضى بيتعالجوا، تحسن الوجع ${s.imp}%`,'مع اللينك الخاص بيه']);return}
  if(d.act==='refnew'){toast('تحويل مريض جديد',['الدكتور بيكتب اسم المريض وموبايله بس','المريض بيظهر في "طلبات حجز جديدة" عند السكرتارية']);return}
  if(d.copy){const v=d.copy;const ok=()=>toast('اتنسخ اللينك',[v]);try{navigator.clipboard.writeText(v).then(ok,ok)}catch(err){ok()}return}
  if(d.act==='order'){toast('طلب المورد جاهز',STOCK.filter(s=>s.q<s.min).map(s=>`${s.n}: ${s.min*2-s.q} ${s.u}`));return}
  if(d.mv)return openStockMove(d.mv);
  if(d.sd)return B.set('dir',d.sd);
  if(d.sq)return B.set('q',+d.sq);
  if(d.sok)return B.apply();
});
function openDelay(){
  B={min:30,scope:'hour',draw:null,count:0};
  B.draw=()=>{const lim=B.scope==='hour'?NOW+60:B.scope==='two'?NOW+120:CLOSE;const l=dayA(TODAY).filter(a=>a.st==='booked'&&a.t>NOW&&a.t<=lim&&['ka','os'].includes(a.ther)).sort((a,b)=>a.t-b.t);B.count=l.length;
    $('#dlBody').innerHTML=`<div class="field"><span class="lab">مين</span><div class="seg full">${[['hour','الساعة الجاية'],['two','ساعتين'],['all','كل الباقيين']].map(([k,t])=>`<button data-dscope="${k}" aria-pressed="${B.scope===k}">${t}</button>`).join('')}</div></div>
    <div class="field"><span class="lab">التأخير</span><div class="chips">${[15,30,45,60].map(m=>`<button class="chip" data-dmin="${m}" aria-pressed="${B.min===m}">${m} دقيقة</button>`).join('')}</div></div>
    <div class="list">${l.map(a=>`<div class="item small"><span class="grow">${esc(P[a.pid].name)}</span><span class="muted xs">${R[a.ther].short}</span><span class="num">${tm(a.t)} ← <b>${tm(a.t+B.min)}</b></span></div>`).join('')}</div>`;
    $('#dlFoot').textContent=`ابعت لـ ${l.length} مريض`};
  drawer('<h2>إشعار تأخير</h2>','<div class="muted small">عند د. كريم ود. عمر. الرسالة بتقول للمريض ميعاده الجديد بالظبط.</div><div id="dlBody" class="stack"></div>','<button class="btn primary big" data-dsend="1" id="dlFoot"></button>');B.draw();
}
function openReqs(focus){
  drawer(`<h2>طلبات حجز جديدة</h2>`,`<div class="muted small">من الموقع ولينكات الدكاترة وواتساب. كل طلب بيتحوّل لميعاد بدوستين.</div>
   ${REQS.map(q=>`<div class="card stack" style="gap:6px;${q.id===focus?'border-color:var(--brand)':''}"><div class="row between"><b>${esc(q.name)}</b><span class="pill">${q.src}</span></div><div class="small">${esc(q.c)}</div><div class="row between"><span class="muted xs ltr">${q.phone}</span><span class="muted xs">${q.when}</span></div><div class="row"><button class="btn sm primary" data-reqbook="${q.id}">حدد ميعاد</button><button class="btn sm" data-call-req="${q.id}">${ic('phone','width="15" height="15"')} اتصل</button></div></div>`).join('')||'<div class="muted">مفيش طلبات.</div>'}`);
}
// drag & drop (desktop)
document.addEventListener('dragstart',e=>{const b=e.target.closest&&e.target.closest('[data-appt]');if(!b)return;e.dataTransfer.setData('text/plain',b.dataset.appt);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-cell]');if(!c)return;e.preventDefault();document.querySelectorAll('.cell.drop').forEach(x=>x!==c&&x.classList.remove('drop'));c.classList.add('drop')});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('[data-cell]');if(c&&!c.contains(e.relatedTarget))c.classList.remove('drop')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-cell]');if(!c)return;e.preventDefault();c.classList.remove('drop');const id=e.dataTransfer.getData('text/plain');const a=findA(id);if(!a)return;const [ther,t]=c.dataset.cell.split('|');if(a.ther===ther&&a.t===+t&&a.d===S.date)return;moveAppt(a,S.date,ther,+t)});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='bq'){B.q=e.target.value;B.focusQ=true;drawBook()}
  if(id==='pq'){S.pq=e.target.value;const q=S.pq.trim();const act=P.filter(p=>p.pkg);const rows=q?P.filter(p=>p.name.includes(q)||p.phone.includes(q)):act;$('#plist').innerHTML=rows.slice(0,60).map(prow).join('')||'<div class="muted" style="padding:20px;text-align:center">مفيش مريض بالاسم ده</div>'}
  if(id==='note'){S.room.note=e.target.value;S.room.edited=true}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='role'){S.role=e.target.value;S.tab=ROLE_TABS[S.role][0];closeDrawer();render();toast({owner:'د. أحمد بيشوف كل حاجة',reception:'السكرتارية: التقويم والتأكيدات والمرضى — من غير فلوس',therapist:'الأخصائي: غرفته وتقويمه بس، من غير تعديل'}[S.role])}
  if(id==='sendEx')S.room.sendEx=e.target.checked;
  if(id==='notifyRef')S.room.notifyRef=e.target.checked;
  if(id==='bsend')B.send=e.target.checked;
  if(id&&id.startsWith('r-')){S.rules[id.slice(2)]=e.target.value;toast('اتحفظت القاعدة',['بتتطبق على كل المواعيد الجاية'])}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.moving){S.moving=null;render()}else closeDrawer()}});

/* ================= boot ================= */
(function(){
  const h=(location.hash||'').slice(1);
  if(ROLE_TABS.owner.includes(h))S.tab=h;
  let seen=false;try{seen=localStorage.getItem('ac-guide')==='done'}catch(e){}
  if(!seen&&!h)S.guide=1;
  render();
  addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(ROLE_TABS[S.role].includes(t)&&t!==S.tab){S.tab=t;render()}});
})();
</script>
</body>
